services:
  - type: web
    name: aksel-rps-stocks
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT 'web_app:create_app()'
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
